version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ethiopian_dating_db
    environment:
      POSTGRES_USER: dating_user
      POSTGRES_PASSWORD: dating_password
      POSTGRES_DB: dating_bot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ethiopian_dating_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
